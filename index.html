<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehicle Playback</title>
<meta name="description" content="24-hour playback of public transport vehicle positions recorded from GTFS-Realtime feeds, city by city.">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/deck.gl@9.1.14/dist.min.js"></script>
<style>
  :root { --fg:#1d1d1f; --muted:#6e6e73; --panel:rgba(255,255,255,.94); --line:#e5e5ea; --bad:#c62828; --accent:#0a58ca; --data:#0a58ca; }
  @media (prefers-color-scheme: dark) { :root { --fg:#f2f2f7; --muted:#a1a1a6; --panel:rgba(28,28,30,.94); --line:#3a3a3c; --bad:#ff6b6b; --accent:#6ea8fe; --data:#6ea8fe; } }
  html, body, #map { margin:0; height:100%; }
  body { font:13px/1.4 system-ui, sans-serif; color:var(--fg); background:#e9e9e9; }
  #panel { position:absolute; top:12px; left:12px; z-index:2; width:300px; max-width:calc(100vw - 48px);
           background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px; box-shadow:0 2px 12px rgba(0,0,0,.12); }
  h1 { font-size:15px; margin:0; }
  a { color:inherit; }
  .muted { color:var(--muted); } .bad { color:var(--bad); }
  .row { margin-top:8px; }
  .feeds { display:grid; grid-template-columns:1fr 1fr; gap:2px 8px; }
  label { white-space:nowrap; }
  input[type=text] { width:100%; box-sizing:border-box; padding:4px 6px; }
  select, input[type=time] { padding:2px; font:inherit; }
  details summary { cursor:pointer; }
  #clock { font-size:22px; font-variant-numeric:tabular-nums; font-weight:600; }
  #slider { width:100%; margin:0; }
  #coverage { height:4px; border-radius:2px; background:var(--line); margin-top:2px; }
  .controls { display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  #playBtn { min-width:44px; font-size:15px; padding:2px 8px; }
  .small { font-size:11px; }
  @media (max-width:500px) { #panel { width:auto; right:12px; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Vehicle playback <select id="city" aria-label="City"></select></h1>
  <div id="day" class="muted">Loading…</div>
  <div class="row" id="clock">—</div>
  <div class="row">
    <input id="slider" type="range" min="0" max="86399" step="10" value="0" aria-label="Time of day">
    <div id="coverage" title="Shaded: recorded data available"></div>
  </div>
  <div class="row controls">
    <button id="playBtn" title="Play / pause (space)">▶</button>
    <select id="speed" aria-label="Playback speed">
      <option value="1">1×</option><option value="2">2×</option><option value="5">5×</option>
      <option value="10">10×</option><option value="30" selected>30×</option><option value="60">60×</option><option value="120">120×</option>
    </select>
    <input id="time" type="time" step="60" aria-label="Jump to time">
  </div>
  <div id="state" class="row muted"></div>
  <details>
    <summary class="row muted">Options</summary>
    <div class="row feeds" id="feeds"></div>
    <div class="row"><input id="routes" type="text" placeholder="Routes, e.g. 333, 380, T1" autocomplete="off"></div>
    <div class="row">
      Colour <select id="colour"><option value="mode" selected>by mode</option><option value="route">by route</option><option value="speed">by speed</option></select>
      <label><input id="trails" type="checkbox" checked> Trails</label>
    </div>
  </details>
  <div class="row muted small">
    Data: <span id="attrib"></span>, recorded from GTFS-Realtime vehicle positions.
    Positions are interpolated between reports.
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
